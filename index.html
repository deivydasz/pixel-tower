<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pixel Tower</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{--mw:max(var(--w,360px),min(360px,calc(100vw - 40px)));--bg:#d5dbe6;--fg:#1b2033;--btn:#ffffff;--bd:#1b2033;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1019;--fg:#e8ecf5;--btn:#1b2033;--bd:#e8ecf5}}
:root[data-theme="dark"]{--bg:#0d1019;--fg:#e8ecf5;--btn:#1b2033;--bd:#e8ecf5}
html{height:100%;margin:0}
body{min-height:100%;margin:0;box-sizing:border-box;padding:16px}
body{background:var(--bg);color:var(--fg);font:9px/1.5 "Press Start 2P",monospace;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;user-select:none;-webkit-user-select:none;touch-action:manipulation}
#hud{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:4px 6px;width:var(--mw,360px)}
#hud button{padding:4px 6px}
canvas{image-rendering:pixelated;background:#1b2033;display:block;outline:4px solid var(--bd)}
#ups,#fyl,#gos,#gob{display:grid;grid-template-columns:1fr 1fr;gap:6px;width:var(--mw,360px)}
#fy,#go{position:fixed;inset:0;box-sizing:border-box;background:var(--bg);display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
#fy p,#go p{width:var(--w,360px);margin:0;font-size:8px;line-height:1.8}
#fyh,#goh{font-size:11px}
#fyl,#gos,#gob,#fy p,#go p{width:min(360px,92vw)}
button{font:inherit;color:var(--fg);background:var(--btn);border:2px solid var(--bd);padding:8px 6px;text-align:left;cursor:pointer;line-height:1.6}
button:disabled{opacity:.4;cursor:default}
button:focus-visible{outline:3px solid #ffd166;outline-offset:2px}
button b{display:block;font-weight:400}
#ups button:last-child:nth-child(odd){grid-column:1/-1}
#stage{position:relative}
#hpb{position:absolute;left:4px;right:4px;top:4px;height:14px;background:#3a4160;border:2px solid #0d1019;pointer-events:none}
#hpf{height:100%;width:100%;background:#6ee7a0}
#hpt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:8px;color:#fff;text-shadow:1px 1px 0 #0d1019}
#leg{position:absolute;right:4px;top:26px;display:flex;flex-direction:column;gap:6px;padding:5px;background:rgba(13,16,25,.6);color:#e8ecf5;font-size:7px;line-height:1.5;pointer-events:none}
#leg div{display:flex;flex-direction:column}
#leg i{display:inline-block;width:7px;height:7px;margin-right:4px;vertical-align:0}
#leg .off{opacity:.4}
</style>
</head>
<body>
<div id="hud"><span id="w">Wave 1</span><span id="px">0 px</span><button id="fb">Foundry</button><span id="ch">0 chips</span><button id="snd" aria-pressed="true">Sound</button></div>
<div id="stage"><canvas id="c" aria-label="Tower defence game"></canvas><div id="hpb"><div id="hpf"></div><span id="hpt"></span></div><div id="leg" aria-label="Enemy types"></div></div>
<div id="ups"></div>
<div id="go"><div id="goh">Game over</div><p id="gop"></p><div id="gob"><button id="gor">Restart</button><button id="gof">Go to foundry</button></div><p>Suggested upgrades:</p><div id="gos"></div></div>
<div id="fy"><div id="fyh"></div><p>Pixel chips come from clearing waves: 1 per wave, plus 1 more for every 5 waves reached. Spend them here on permanent boosts that carry into every future run.</p><div id="fyl"></div><button id="fyc">Back to game</button></div>
<script>
const W=180,H=240,CX=90,CY=120;
const cv=document.getElementById('c'),g=cv.getContext('2d');
cv.width=W;cv.height=H;
function fit(){
  const raw=Math.min((innerWidth-48)/W,(innerHeight-250)/H),s=Math.max(1,raw>=3?Math.floor(raw):Math.floor(raw*4)/4);
  cv.style.width=W*s+'px';cv.style.height=H*s+'px';
  document.documentElement.style.setProperty('--w',W*s+'px');
}
addEventListener('resize',fit);fit();

const UP={
  dmg:{n:'Damage',base:10},
  rate:{n:'Fire rate',base:15},
  range:{n:'Range',base:12},
  hp:{n:'Tower HP',base:20},
  armor:{n:'Pixel absorber',base:25}
};
const TYPES=[
  {min:1,sp:18,hp:1,c:'#ff6b6b',s:5,px:3,d:1,n:'Grunt',up:'rate'},
  {min:3,sp:34,hp:.5,c:'#ffd166',s:3,px:2,d:1,n:'Runner',up:'range'},
  {min:5,sp:11,hp:4,c:'#b388ff',s:7,px:8,d:3,n:'Tank',up:'armor'}
];
let S;
function reset(){
  S={hp:20,px:0,wave:0,en:[],pr:[],pt:[],left:0,sp:0,gap:.5,cd:0,over:false,flash:0,lv:{dmg:0,rate:0,range:0,hp:0,armor:0},ot:0,pause:false,earn:0,shake:0};S.hp=stat.max();
}
const stat={
  dmg:()=>1+S.lv.dmg+.5*M.lv.dmg,
  rate:()=>1+.4*S.lv.rate+.2*M.lv.rate,
  range:()=>50+8*S.lv.range+4*M.lv.range,
  max:()=>20+10*S.lv.hp+5*M.lv.hp,
  armor:()=>.5*S.lv.armor+.25*M.lv.armor
};
const cost=k=>Math.round(UP[k].base*Math.pow(1.6,S.lv[k]));
// Save format version. Saves without `v` are v0 (same shape as v1).
// When the shape changes: bump SAVE_V and add a step in loadMeta, e.g. if(v<2){...}.
const SAVE_V=1;
let M={v:SAVE_V,chips:0,lv:{dmg:0,rate:0,range:0,hp:0,armor:0},mute:false};
function loadMeta(m){
  if(!m||!m.lv)return;
  M={v:SAVE_V,chips:m.chips|0,lv:Object.assign(M.lv,m.lv),mute:!!m.mute};
}
try{loadMeta(JSON.parse(localStorage.getItem('pixelTowerMeta')))}catch(e){}
const save=()=>{try{localStorage.setItem('pixelTowerMeta',JSON.stringify(M))}catch(e){}};
const mcost=k=>Math.round(3*Math.pow(1.7,M.lv[k]));

// Sound: tiny synthesized blips through a quiet master volume. No audio files.
const VOL=.12;
let AC=null,MG=null;
function audio(){
  if(!AC&&!M.mute){
    const C=window.AudioContext||window.webkitAudioContext;if(!C)return;
    AC=new C();MG=AC.createGain();MG.gain.value=VOL;MG.connect(AC.destination);
  }
  if(AC&&AC.state==='suspended')AC.resume();
}
for(const ev of['pointerdown','touchend','keydown'])addEventListener(ev,audio,{passive:true});
function tone(f,dur,type,vol,f2,delay){
  const t=AC.currentTime+(delay||0),o=AC.createOscillator(),gn=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);
  if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);
  gn.gain.setValueAtTime(vol,t);gn.gain.exponentialRampToValueAtTime(.001,t+dur);
  o.connect(gn).connect(MG);o.start(t);o.stop(t+dur+.02);
}
const SFX={
  shot:()=>tone(880,.04,'square',.1,660),
  kill:()=>tone(300,.12,'triangle',.4,90),
  pick:()=>tone(1100+Math.random()*400,.03,'sine',.2),
  hit:()=>tone(150,.18,'triangle',.7,60),
  buy:()=>{tone(520,.07,'square',.15,780);tone(780,.08,'square',.15,1040,.07)},
  wave:()=>[523,659,784].forEach((f,i)=>tone(f,.12,'triangle',.4,0,i*.09)),
  over:()=>[392,311,233].forEach((f,i)=>tone(f,.25,'triangle',.5,0,i*.18))
};
const GAP={shot:.05,pick:.06,kill:.03},lastSfx={};
function sfx(k){
  if(M.mute||!AC||AC.state!=='running')return;
  const now=AC.currentTime;
  if(GAP[k]&&now-(lastSfx[k]||0)<GAP[k])return;
  lastSfx[k]=now;SFX[k]();
}
const RM=matchMedia('(prefers-reduced-motion: reduce)');
function buzz(ms){const ua=navigator.userActivation;if(!M.mute&&navigator.vibrate&&(!ua||ua.hasBeenActive))navigator.vibrate(ms)}
const sndb=document.getElementById('snd');
function sndUI(){sndb.textContent=M.mute?'Muted':'Sound';sndb.setAttribute('aria-pressed',String(!M.mute))}
sndb.onclick=()=>{M.mute=!M.mute;save();sndUI();audio()};
sndUI();

const ehp=t=>Math.max(1,Math.round(2*Math.pow(1.12,Math.max(1,S.wave))*t.hp));
const edmg=t=>Math.max(.2,t.d-stat.armor());
const fmt=n=>+n.toFixed(2)+'';
const leg=document.getElementById('leg'),legr=TYPES.map(t=>{
  const d=document.createElement('div');
  d.innerHTML='<span><i style="background:'+t.c+'"></i>'+t.n+'</span><span></span>';
  leg.appendChild(d);return d;
});
const ups=document.getElementById('ups'),btns={};
for(const k in UP){
  const b=document.createElement('button');
  b.onclick=()=>{
    const c=cost(k);
    if(S.over||S.px<c)return;
    S.px-=c;S.lv[k]++;sfx('buy');
    if(k==='hp')S.hp=Math.min(stat.max(),S.hp+10);
  };
  ups.appendChild(b);btns[k]=b;
}
cv.addEventListener('pointerdown',()=>{if(S.over&&S.ot>.6)reset()});

function startWave(){
  S.wave++;S.left=4+S.wave*2;S.sp=0;S.paid=false;
}
function spawn(){
  const ok=TYPES.filter(t=>S.wave>=t.min);
  const t=ok[Math.floor(Math.random()*ok.length)];
  const a=Math.random()*Math.PI*2;
  S.en.push({x:CX+Math.cos(a)*140,y:CY+Math.sin(a)*140,t,hp:ehp(t),hit:0});
}
function kill(e){
  sfx('kill');
  for(let i=0;i<e.t.px;i++){
    const a=Math.random()*Math.PI*2,v=20+Math.random()*30;
    S.pt.push({x:e.x,y:e.y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,c:e.t.c,t:0});
  }
}
function update(dt){
  if(S.pause)return;
  S.bonus=Math.max(0,(S.bonus||0)-dt);
  S.shake=Math.max(0,S.shake-dt);
  if(S.over){S.ot+=dt;return}
  // waves
  if(S.left>0){
    S.sp-=dt;
    if(S.sp<=0){spawn();S.left--;S.sp=Math.max(.25,1.1-S.wave*.05)}
  }else if(!S.en.length){
    if(S.wave>0&&!S.paid){S.paid=true;const p=5+S.wave*2,c=1+Math.floor(S.wave/5);S.px+=p;M.chips+=c;S.earn+=c;S.bonus=1.2;sfx('wave');S.bt='+'+p+' px +'+c+' chips';save()}
    S.gap-=dt;
    if(S.gap<=0){startWave();S.gap=1.5}
  }
  // enemies
  for(const e of S.en){
    const dx=CX-e.x,dy=CY-e.y,d=Math.hypot(dx,dy);
    e.x+=dx/d*e.t.sp*dt;e.y+=dy/d*e.t.sp*dt;
    e.hit=Math.max(0,e.hit-dt);
    if(d<8){e.dead=true;e.reached=true;S.hp-=Math.max(.2,e.t.d-stat.armor());S.killer=e.t;S.flash=.15;S.shake=.2;sfx('hit');buzz(30)}
  }
  S.en=S.en.filter(e=>!e.dead);
  if(S.hp<=0){S.hp=0;S.over=true;save();sfx('over');buzz([60,40,120]);showGO();return}
  S.flash=Math.max(0,S.flash-dt);
  // tower fire
  S.cd-=dt;
  let target=null,best=1e9;
  for(const e of S.en){
    const d=Math.hypot(e.x-CX,e.y-CY);
    if(d<=stat.range()&&d<best){best=d;target=e}
  }
  S.target=target;
  if(target&&S.cd<=0){
    const d=Math.hypot(target.x-CX,target.y-CY);
    S.pr.push({x:CX,y:CY,vx:(target.x-CX)/d*130,vy:(target.y-CY)/d*130,life:1.5});
    S.cd=1/stat.rate();sfx('shot');
  }
  // projectiles
  for(const p of S.pr){
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;
    for(const e of S.en){
      if(!e.dead&&Math.abs(p.x-e.x)<e.t.s/2+1&&Math.abs(p.y-e.y)<e.t.s/2+1){
        e.hp-=stat.dmg();e.hit=.08;p.life=0;
        if(e.hp<=0){e.dead=true;kill(e)}
        break;
      }
    }
  }
  S.pr=S.pr.filter(p=>p.life>0);
  S.en=S.en.filter(e=>!e.dead);
  // pixels fly to the tower
  for(const p of S.pt){
    p.t+=dt;
    if(p.t<.3){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.92;p.vy*=.92}
    else{
      const dx=CX-p.x,dy=CY-p.y,d=Math.hypot(dx,dy),v=70+(p.t-.3)*300;
      p.x+=dx/d*v*dt;p.y+=dy/d*v*dt;
      if(d<5){p.done=true;S.px++;sfx('pick')}
    }
  }
  S.pt=S.pt.filter(p=>!p.done);
}
function R(x,y,w,h,c){g.fillStyle=c;g.fillRect(Math.round(x),Math.round(y),w,h)}
function draw(){
  g.clearRect(0,0,W,H);
  g.save();
  if(S.shake>0&&!S.over&&!RM.matches)g.translate(Math.round(Math.random()*2-1),Math.round(Math.random()*2-1));
  // range ring
  g.strokeStyle='rgba(143,163,214,.25)';g.lineWidth=1;
  g.beginPath();g.arc(CX+.5,CY+.5,stat.range(),0,Math.PI*2);g.stroke();
  // pixels
  for(const p of S.pt)R(p.x-1,p.y-1,2,2,p.c);
  // enemies
  for(const e of S.en){const s=e.t.s;R(e.x-s/2,e.y-s/2,s,s,e.hit>0?'#fff':e.t.c)}
  // projectiles
  for(const p of S.pr)R(p.x-1,p.y-1,2,2,'#fff');
  // tower
  R(CX-5,CY-5,11,11,S.flash>0?'#ff6b6b':'#8fa3d6');
  R(CX-3,CY-3,7,7,'#e8ecf5');
  R(CX-1,CY-1,3,3,'#1b2033');
  if(S.lv.armor){const a=Math.min(S.lv.armor,4),c='#5ec8ff';R(CX-7,CY-7,13+0,1,c);R(CX-7,CY+7,13,1,a>1?c:'rgba(0,0,0,0)');R(CX-7,CY-7,1,15,a>2?c:'rgba(0,0,0,0)');R(CX+7,CY-7,1,15,a>3?c:'rgba(0,0,0,0)')}
  if(S.target){
    const a=Math.atan2(S.target.y-CY,S.target.x-CX);
    R(CX+Math.cos(a)*7-1,CY+Math.sin(a)*7-1,3,3,'#ffd166');
  }
  g.restore();
  if(S.bonus>0&&!S.over){g.fillStyle='#ffd166';g.textAlign='center';g.font='7px "Press Start 2P",monospace';g.fillText('Wave '+S.wave+' clear',CX,28);g.fillText(S.bt,CX,40)}
  if(S.over){
    g.fillStyle='rgba(13,16,25,.8)';g.fillRect(0,0,W,H);
    g.fillStyle='#e8ecf5';g.textAlign='center';
    g.font='10px "Press Start 2P",monospace';g.fillText('GAME OVER',CX,CY-8);
    g.font='7px "Press Start 2P",monospace';
    g.fillText('Reached wave '+S.wave,CX,CY+8);
    g.fillText('+'+S.earn+' chips',CX,CY+24);
    g.fillText('Tap to restart',CX,CY+40);
  }
}
function ui(){
  document.getElementById('w').textContent='Wave '+Math.max(1,S.wave);
  document.getElementById('px').textContent=S.px+' px';
  document.getElementById('ch').textContent=M.chips+' chips';
  const m=stat.max(),hp=Math.max(0,S.hp);
  document.getElementById('hpf').style.width=(100*hp/m)+'%';
  document.getElementById('hpt').textContent='HP '+fmt(Math.ceil(hp*10)/10)+'/'+m;
  TYPES.forEach((t,i)=>{
    const on=Math.max(1,S.wave)>=t.min,r=legr[i];
    r.className=on?'':'off';
    r.lastChild.textContent=on?'HP '+ehp(t)+' Dmg '+fmt(edmg(t)):'Wave '+t.min;
  });
  const info={dmg:'Dmg '+stat.dmg(),rate:stat.rate().toFixed(1)+'/s',range:stat.range()+' px',hp:'HP '+stat.max(),armor:'Absorbs '+stat.armor().toFixed(2)};
  for(const k in UP){
    const c=cost(k);
    btns[k].innerHTML='<b>'+UP[k].n+'</b>'+info[k]+' · '+c+' px';
    btns[k].disabled=S.over||S.px<c;
  }
}
const fy=document.getElementById('fy'),fyl=document.getElementById('fyl'),fyh=document.getElementById('fyh'),fyb={};
const MI={dmg:'+0.5 damage',rate:'+0.2 shots/s',range:'+4 range',hp:'+5 max HP',armor:'+0.25 absorb'};
for(const k in UP){
  const b=document.createElement('button');
  b.onclick=()=>{const c=mcost(k);if(M.chips<c)return;M.chips-=c;M.lv[k]++;save();sfx('buy');fyUI()};
  fyl.appendChild(b);fyb[k]=b;
}
function fyUI(){
  fyh.textContent='Pixel foundry: '+M.chips+' chips';
  for(const k in UP){const c=mcost(k);fyb[k].innerHTML='<b>'+UP[k].n+' (Lv '+M.lv[k]+')</b>'+MI[k]+' · '+c+' chips';fyb[k].disabled=M.chips<c}
}
function showGO(){
  document.getElementById('gop').textContent='You reached wave '+S.wave+', killed by a '+(S.killer?S.killer.n:'enemy')+'. This run earned '+S.earn+' chips. You have '+M.chips+' chips.';
  const s=document.getElementById('gos');s.innerHTML='';
  const ks=Object.keys(UP).sort((a,b)=>mcost(a)-mcost(b)),kt=S.killer,pick=[{k:ks[0],why:'Cheapest'}];
  if(kt&&kt.up===ks[0]){pick[0].why='Cheapest, and counters '+kt.n+'s';pick.push({k:ks[1],why:'Next cheapest'})}
  else if(kt)pick.push({k:kt.up,why:'Counters '+kt.n+'s'});
  else pick.push({k:ks[1],why:'Next cheapest'});
  pick.forEach(({k,why})=>{
    const c=mcost(k),b=document.createElement('button');
    b.innerHTML='<b>'+UP[k].n+' (Lv '+M.lv[k]+')</b>'+why+'<br>'+MI[k]+' · '+c+' chips';
    b.disabled=M.chips<c;
    b.onclick=()=>{if(M.chips<c)return;M.chips-=c;M.lv[k]++;save();sfx('buy');showGO()};
    s.appendChild(b);
  });
  document.getElementById('go').style.display='flex';
}
document.getElementById('gor').onclick=()=>{document.getElementById('go').style.display='none';reset()};
document.getElementById('gof').onclick=()=>{document.getElementById('go').style.display='none';S.pause=true;fyUI();fy.style.display='flex'};
document.getElementById('fb').onclick=()=>{S.pause=true;fyUI();fy.style.display='flex'};
document.getElementById('fyc').onclick=()=>{S.pause=false;fy.style.display='none';if(S.over)showGO()};
reset();
let last=performance.now(),acc=0;
function loop(t){
  acc+=Math.min(.25,(t-last)/1000);last=t;
  while(acc>=1/60){update(1/60);acc-=1/60}
  draw();ui();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
