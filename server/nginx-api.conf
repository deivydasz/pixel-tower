# Included in the pixel-tower (live) and preview HTTPS server blocks: game events go to server/stats.py.
location = /api/e {
    limit_except POST { deny all; }
    client_max_body_size 8k;
    proxy_pass http://127.0.0.1:8787;
    access_log off;
}
# the server code and service files are not part of the website
location ^~ /server/ { return 404; }
